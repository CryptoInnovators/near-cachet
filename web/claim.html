<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Open a Bitcoin gift. Its sealed state and satoshi amount are read live from the chain, then claim it with or without a NEAR wallet.">
  <title>Cachet, claim a Bitcoin gift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238b1a22'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%236a1118'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/gloock-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/schibsted-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip" href="#main">Skip to the gift</a>

  <div class="frame">
    <header class="bar">
      <a class="wordmark" href="index.html" aria-label="Cachet home">Cachet</a>
      <nav class="nav" aria-label="Sections">
        <a href="claim.html" id="nav-claim" aria-current="page">Claim a gift</a>
        <a href="index.html#how">How a gift moves</a>
        <a href="index.html#desk">Your notes</a>
      </nav>
      <p class="conn" id="claim-connect-status" aria-live="polite"></p>
      <button class="btn btn-quiet" id="claim-connect" type="button">Connect wallet</button>
    </header>
  </div>

  <main id="main">
    <div class="frame">
      <section class="gift" aria-labelledby="gift-title">
        <div class="gift-copy">
          <h1 class="display rise" id="gift-title">Claim your Bitcoin gift.</h1>
          <p class="lead rise" id="gift-sub" style="--d:1">Opening the gift pool on the contract.</p>
          <p class="gift-status" id="claim-status" role="status" aria-live="polite"></p>
        </div>
        <div class="gift-card rise" style="--d:2"><div id="card-slot" aria-live="polite"></div></div>
        <ol class="stations rise" id="stations" style="--d:3" aria-label="The four steps of the claim"></ol>
      </section>
    </div>
  </main>

  <footer class="foot field-ink on-ink">
    <div class="frame"><p class="prov" id="foot-facts"></p></div>
  </footer>

  <noscript><p class="noscript">Cachet reads the gift live from the chain with JavaScript. Enable JavaScript to open it.</p></noscript>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="chain.js" defer></script>
  <script src="outcome.js" defer></script>
  <script src="btc-proof.js" defer></script>
  <script src="claim-lib.js" defer></script>
  <script src="linkdrop-claim.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="seal.js" defer></script>
  <script src="card.js" defer></script>
  <script type="module" src="wallet.js"></script>
  <script src="claim.js" defer></script>
</body>
</html>
