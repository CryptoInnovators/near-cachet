name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: layout check
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "no root Cargo.toml. Add a workspace manifest so CI can build every contract."
            exit 1
          fi
      - name: install cargo-near 0.16.0 (prebuilt release, checksum verified)
        run: |
          base=https://github.com/near/cargo-near/releases/download/cargo-near-v0.16.0
          curl -fsSL -o cn.tgz "$base/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$base/cargo-near-x86_64-unknown-linux-gnu.tar.gz.sha256" | awk '{print $1 "  cn.tgz"}' | sha256sum -c -
          tar -xzf cn.tgz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          cargo near --version
      - name: fetch fixtures
        run: ./scripts/fetch-fixtures.sh
      - name: build wasm
        run: |
          cargo build --workspace --release --target wasm32-unknown-unknown
      - name: test
        run: |
          cargo test --workspace --no-fail-fast
